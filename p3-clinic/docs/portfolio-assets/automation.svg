<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560"
     font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-label="P3 booking automation flow: saved booking, signed webhook, n8n verification, Telegram alert">
  <defs>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arwDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#f8fafc"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">P3 — Booking automation</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">HMAC-signed webhook · the booking itself never waits on n8n (fail-open)</text>

  <!-- Row 1: WordPress side -->
  <rect x="40" y="96" width="240" height="116" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="160" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Booking saved</text>
  <text x="160" y="154" text-anchor="middle" font-size="14" fill="#1f2937">siraj_booking CPT + meta</text>
  <text x="160" y="176" text-anchor="middle" font-size="14" fill="#1f2937">nonce · honeypot · validation</text>
  <text x="160" y="198" text-anchor="middle" font-size="14" fill="#1f2937">phone normalised +20…</text>

  <rect x="330" y="96" width="240" height="116" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="450" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">siraj_booking_created</text>
  <text x="450" y="154" text-anchor="middle" font-size="14" fill="#1f2937">do_action() — domain event</text>
  <text x="450" y="176" text-anchor="middle" font-size="14" fill="#1f2937">fired AFTER meta is written</text>
  <text x="450" y="198" text-anchor="middle" font-size="14" fill="#1f2937">not save_post (too early)</text>

  <rect x="620" y="96" width="240" height="116" rx="8" fill="#eef2ff" stroke="#2f4bd8" stroke-width="1.6"/>
  <text x="740" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">notifier.php</text>
  <text x="740" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">HMAC-SHA256 signature</text>
  <text x="740" y="168" text-anchor="middle" font-size="14" fill="#1f2937">X-Siraj-Signature: v1=hex(...)</text>
  <text x="740" y="188" text-anchor="middle" font-size="14" fill="#1f2937">X-Siraj-Timestamp · skew ≤300s</text>
  <text x="740" y="206" text-anchor="middle" font-size="14" fill="#1f2937">timeout 3s · fail → error_log</text>

  <line x1="288" y1="154" x2="322" y2="154" stroke="#334155" stroke-width="1.6" marker-end="url(#arw2)"/>
  <line x1="578" y1="154" x2="612" y2="154" stroke="#334155" stroke-width="1.6" marker-end="url(#arw2)"/>

  <!-- connector: notifier → n8n -->
  <polyline points="740,212 740,240 450,240 450,260" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arw2)"/>
  <text x="640" y="233" text-anchor="middle" font-size="13" fill="#64748b">POST signed payload (3s timeout)</text>

  <!-- Row 2: n8n side -->
  <rect x="330" y="266" width="240" height="110" rx="8" fill="#eef2ff" stroke="#2f4bd8" stroke-width="1.6"/>
  <text x="450" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">n8n webhook</text>
  <text x="450" y="322" text-anchor="middle" font-size="14" fill="#1f2937">Code: verify → normalise</text>
  <text x="450" y="344" text-anchor="middle" font-size="14" fill="#1f2937">IF valid → Respond 200</text>
  <text x="450" y="366" text-anchor="middle" font-size="14" fill="#1f2937">bad / expired signature → 401</text>

  <rect x="620" y="266" width="240" height="110" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="740" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Telegram alert</text>
  <text x="740" y="322" text-anchor="middle" font-size="14" fill="#1f2937">owner's private chat only</text>
  <text x="740" y="344" text-anchor="middle" font-size="14" fill="#1f2937">name · phone · service · date</text>
  <text x="740" y="366" text-anchor="middle" font-size="14" fill="#1f2937">booking id</text>

  <line x1="578" y1="321" x2="612" y2="321" stroke="#334155" stroke-width="1.6" marker-end="url(#arw2)"/>

  <!-- Error workflow -->
  <rect x="40" y="266" width="240" height="110" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="160" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Error Workflow</text>
  <text x="160" y="322" text-anchor="middle" font-size="14" fill="#1f2937">error-alert.json attached</text>
  <text x="160" y="344" text-anchor="middle" font-size="14" fill="#1f2937">any workflow failure →</text>
  <text x="160" y="366" text-anchor="middle" font-size="14" fill="#1f2937">Telegram error message</text>

  <line x1="322" y1="321" x2="288" y2="321" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwDash)"/>
  <text x="305" y="311" text-anchor="middle" font-size="12" fill="#7c3aed">on fail</text>

  <!-- note -->
  <rect x="40" y="412" width="820" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="450" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Live run = owner's n8n (licence rule) · tested on a local sink</text>
  <text x="450" y="462" text-anchor="middle" font-size="14" fill="#1f2937">VALID full payload · tampered signature → 401 · expired timestamp → 401</text>
  <text x="450" y="482" text-anchor="middle" font-size="13" fill="#64748b">docs/evidence/n8n-sink-test.txt · n8n-sink-e2e.txt · runbook: n8n/README.md</text>

  <text x="450" y="524" text-anchor="middle" font-size="13" fill="#64748b">Same signature logic in three places: notifier.php · n8n Code node · scripts/n8n-sink.js</text>
</svg>
