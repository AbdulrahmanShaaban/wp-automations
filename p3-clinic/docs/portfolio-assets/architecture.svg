<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560"
     font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-label="P3 architecture diagram: browser, Apache/WordPress, MySQL and scripts">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#f8fafc"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">P3 — Architecture</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Arabic RTL demo site · block theme + custom plugin · local wp-env, port 8889</text>

  <!-- Browser (right — RTL reading order) -->
  <rect x="630" y="100" width="210" height="150" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="735" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Browser</text>
  <text x="735" y="156" text-anchor="middle" font-size="14" fill="#1f2937">Arabic RTL (lang=ar)</text>
  <text x="735" y="178" text-anchor="middle" font-size="14" fill="#1f2937">localhost:8889</text>
  <text x="735" y="200" text-anchor="middle" font-size="14" fill="#1f2937">desktop · tablet · phone</text>
  <text x="735" y="222" text-anchor="middle" font-size="14" fill="#1f2937">JS reveal-on-scroll</text>

  <!-- Apache / WordPress (centre) -->
  <rect x="345" y="100" width="210" height="150" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="450" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Apache / WordPress</text>
  <text x="450" y="154" text-anchor="middle" font-size="14" fill="#1f2937">PHP 8.3 · WordPress 7.1.3</text>
  <text x="450" y="176" text-anchor="middle" font-size="14" fill="#1f2937">theme: siraj-theme</text>
  <text x="450" y="198" text-anchor="middle" font-size="14" fill="#1f2937">plugin: siraj-core</text>
  <text x="450" y="220" text-anchor="middle" font-size="14" fill="#1f2937">booking + hardening + SEO</text>
  <text x="450" y="242" text-anchor="middle" font-size="14" fill="#1f2937">notifier (HMAC) → n8n</text>

  <!-- MySQL (left) -->
  <rect x="60" y="100" width="210" height="150" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="165" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">MySQL</text>
  <text x="165" y="156" text-anchor="middle" font-size="14" fill="#1f2937">siraj_booking CPT rows</text>
  <text x="165" y="178" text-anchor="middle" font-size="14" fill="#1f2937">post + meta (PII)</text>
  <text x="165" y="200" text-anchor="middle" font-size="14" fill="#1f2937">siraj_ip_hash (hashed)</text>
  <text x="165" y="222" text-anchor="middle" font-size="14" fill="#1f2937">seed writes are idempotent</text>

  <!-- request flow: right → left (RTL) -->
  <line x1="622" y1="175" x2="563" y2="175" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="592" y="166" text-anchor="middle" font-size="13" fill="#64748b">HTTP</text>
  <line x1="337" y1="175" x2="278" y2="175" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="307" y="166" text-anchor="middle" font-size="13" fill="#64748b">SQL</text>

  <!-- scripts / -->
  <rect x="345" y="330" width="210" height="140" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="450" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">scripts/</text>
  <text x="450" y="386" text-anchor="middle" font-size="14" fill="#1f2937">seed.sh — idempotent boot</text>
  <text x="450" y="408" text-anchor="middle" font-size="14" fill="#1f2937">verify.sh — 50/50 ALL PASS</text>
  <text x="450" y="430" text-anchor="middle" font-size="14" fill="#1f2937">php-tune.js — opcache tune</text>
  <text x="450" y="452" text-anchor="middle" font-size="14" fill="#1f2937">booking-e2e.js — flow test</text>

  <line x1="450" y1="330" x2="450" y2="258" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <text x="462" y="298" text-anchor="start" font-size="13" fill="#64748b">builds · measures · gates</text>

  <text x="450" y="520" text-anchor="middle" font-size="13" fill="#64748b">No external services · no WooCommerce · docs/ARCHITECTURE.md is the source of truth</text>
</svg>
