<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>share</title>
<style>
  @font-face{
    font-family:'Alexandria';font-style:normal;font-weight:400 800;font-display:block;
    src:url('../wp-content/themes/siraj-theme/assets/fonts/alexandria-arabic.woff2') format('woff2');
    unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE80-FEFC;
  }
  @font-face{
    font-family:'Alexandria';font-style:normal;font-weight:400 800;font-display:block;
    src:url('../wp-content/themes/siraj-theme/assets/fonts/alexandria-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:'Alexandria',system-ui,sans-serif;color:#12132B;background:#F7F8FC;
    display:flex;direction:rtl;position:relative;
  }
  .accent-bar{position:absolute;inset-block:0;inset-inline-start:0;width:22px;background:#2F4BD8}
  .blob{
    position:absolute;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#2F4BD8 0%,#243BB4 60%,#1E33A0 100%);
    inset-block-start:-190px;inset-inline-end:-160px;opacity:.10;
  }
  .blob-2{
    position:absolute;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle at 40% 40%,#A3231B 0%,#8A1D16 70%);
    inset-block-end:-140px;inset-inline-start:-110px;opacity:.08;
  }
  .card{
    position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
    justify-content:center;padding:76px 96px;gap:28px;
  }
  .top{display:flex;align-items:center;gap:20px}
  .logo{width:74px;height:74px;border-radius:18px;background:#FFFFFF;border:1.5px solid #E1E2EF;
    display:flex;align-items:center;justify-content:center;
    background-image:url('../wp-content/themes/siraj-theme/assets/img/logo-mark.svg');
    background-size:46px;background-repeat:no-repeat;background-position:center;
  }
  .demo{
    background:#A3231B;color:#fff;font-size:24px;font-weight:700;
    padding:8px 22px;border-radius:14px;letter-spacing:0;
  }
  h1{font-size:76px;font-weight:800;line-height:1.3;max-width:900px}
  .tagline{font-size:34px;font-weight:500;color:#555878;line-height:1.7;max-width:880px}
  .meta{display:flex;gap:18px;align-items:center;margin-top:6px}
  .pill{
    background:#fff;border:1.5px solid #E1E2EF;color:#2F4BD8;
    font-size:26px;font-weight:700;padding:12px 26px;border-radius:14px;
  }
  .note{font-size:24px;color:#555878;font-weight:500}
</style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="blob"></div>
  <div class="blob-2"></div>
  <div class="card">
    <div class="top">
      <div class="logo"></div>
      <span class="demo" lang="en">Demo</span>
    </div>
    <h1>عيادة سِراج للأسنان</h1>
    <p class="tagline">طب أسنان وحجز زيارات أونلاين — فحص، تنظيف، تقويم، وزراعة أسنان</p>
    <div class="meta">
      <span class="pill">القاهرة · وسط البلد</span>
      <span class="note">نموذج تجريبي · لا يمثّل عيادة حقيقية</span>
    </div>
  </div>
</body>
</html>
