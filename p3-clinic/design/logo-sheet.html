<!doctype html>
<!-- Logo sheet — checks the mark at the three sizes it is actually used at
     (32px in the header, 16px as a favicon, 120px on the about/footer). -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<title>P3 — logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:32px;background:#F7F8FC;color:#12132B;font-family:Alexandria,system-ui,sans-serif}
  h1{font-size:1.2rem;margin:0 0 20px}
  .row{display:flex;gap:36px;align-items:flex-end;flex-wrap:wrap;margin-bottom:32px}
  .cell{background:#fff;border:1px solid #E1E2EF;border-radius:14px;padding:16px;text-align:center}
  .cell span{display:block;font-size:.75rem;color:#555878;margin-top:8px}
  .bar{background:#12132B;color:#fff;padding:24px;display:flex;align-items:center;gap:14px;border-radius:14px}
  .bar.onblue{background:#2F4BD8}
  .word{font-weight:800;font-size:1.15rem}
  .word small{display:block;font-weight:400;font-size:.7rem;opacity:.8}
  img{display:block}
</style>
</head>
<body>
  <h1>P3 — اللوجو</h1>
  <div class="row">
    <div class="cell"><img src="img/logo-mark.svg" width="120" height="120" alt=""><span>120px</span></div>
    <div class="cell"><img src="img/favicon.svg" width="48" height="48" alt=""><span>48px</span></div>
    <div class="cell"><img src="img/favicon.svg" width="32" height="32" alt=""><span>32px (هيدر)</span></div>
    <div class="cell"><img src="img/favicon.svg" width="16" height="16" alt=""><span>16px (favicon)</span></div>
  </div>
  <div class="row">
    <div class="bar">
      <img src="img/favicon.svg" width="34" height="34" alt="">
      <span class="word">عيادة سِراج للأسنان<small>نموذج تجريبي · Demo</small></span>
    </div>
    <div class="bar onblue">
      <img src="img/favicon.svg" width="34" height="34" alt="">
      <span class="word">عيادة سِراج للأسنان<small>نموذج تجريبي · Demo</small></span>
    </div>
  </div>
</body>
</html>
