<!doctype html>
<!-- Contact sheet for the chosen photography — open design/media-sheet.html to review
     every downloaded frame at once, with its Unsplash id and intended slot. -->
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<title>P3 — photography set</title>
<style>
  body{margin:0;padding:32px;background:#F7F8FC;color:#12132B;
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7}
  h1{font-size:1.4rem;margin:0 0 4px;direction:rtl}
  p.lead{margin:0 0 8px;color:#555878;direction:rtl}
  p.lic{font-size:.85rem;color:#A3231B;direction:rtl;margin:0 0 24px}
  .grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  figure{margin:0;background:#fff;border:1px solid #E1E2EF;border-radius:14px;padding:12px}
  img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:8px;background:#F7F8FC}
  .sq img{aspect-ratio:1/1}
  figcaption{font-size:.8rem;color:#555878;margin-top:8px;direction:rtl;text-align:start}
  code{font-size:.72rem;color:#2F4BD8;word-break:break-all}
</style>
</head>
<body>
  <h1>P3 — طقم الصور (Unsplash مجاني)</h1>
  <p class="lead">كل الصور من Unsplash (ترخيص مجاني للاستخدام التجاري، بدون فوترة) وبأبعاد 1400px.</p>
  <p class="lic">مستبعدين: أي صورة من Unsplash+ أو iStock (مدفوعة/مرخّصة).</p>
  <div class="grid">
    <figure class="sq"><img src="img/photos/band-exam.jpg" alt=""><figcaption>الفحص والتخطيط — <code>band-exam.jpg</code></figcaption></figure>
    <figure class="sq"><img src="img/photos/band-tools.jpg" alt=""><figcaption>تعقيم الأدوات — <code>band-tools.jpg</code></figcaption></figure>
    <figure class="sq"><img src="img/photos/band-implant.jpg" alt=""><figcaption>الزراعة — <code>band-implant.jpg</code></figcaption></figure>
    <figure><img src="img/photos/team-restorative.jpg" alt=""><figcaption>د. منى — الحشو — <code>team-restorative.jpg</code></figcaption></figure>
    <figure><img src="img/photos/team-ortho.jpg" alt=""><figcaption>د. كريم — التقويم — <code>team-ortho.jpg</code></figcaption></figure>
    <figure><img src="img/photos/team-implant.jpg" alt=""><figcaption>د. هالة — الزراعة — <code>team-implant.jpg</code></figcaption></figure>
    <figure><img src="img/photos/contact-lounge.jpg" alt=""><figcaption>قاعة الانتظار — <code>contact-lounge.jpg</code></figcaption></figure>
    <figure class="sq"><img src="img/photos/spare-office.jpg" alt=""><figcaption>احتياطي: غرفة الكشف — <code>spare-office.jpg</code></figcaption></figure>
  </div>
</body>
</html>
